<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Picks</title>
<style>
  :root {
    --bg: #faf6f0; --card: #ffffff; --ink: #2a2420; --muted: #7a6e64;
    --line: #e8dfd4; --accent: #c2572b; --accent-soft: #f6e4da; --chip: #f1ebe3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --card: #262220; --ink: #f1ebe3; --muted: #a39788;
      --line: #3a3430; --accent: #e8794a; --accent-soft: #3d2a20; --chip: #332d29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  form { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
         padding: 20px; display: grid; gap: 16px; }
  label.field { display: grid; gap: 6px; font-weight: 600; font-size: 0.9rem; }
  .artist-box { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
                border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .artist-box input { flex: 1; min-width: 140px; border: 0; background: transparent;
                      color: var(--ink); font: inherit; padding: 4px; outline: none; }
  .tag { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft);
         color: var(--ink); padding: 4px 6px 4px 10px; border-radius: 999px; font-weight: 500; }
  .tag button { border: 0; background: none; color: var(--muted); cursor: pointer;
                font-size: 1rem; line-height: 1; padding: 0 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; }
  select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--bg); color: var(--ink); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; padding-bottom: 8px; }
  button.go { margin-left: auto; background: var(--accent); color: #fff; border: 0;
              border-radius: 10px; padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  button.go:disabled { opacity: 0.6; cursor: wait; }

  #status { margin: 20px 0 0; color: var(--muted); }
  #status.error { color: var(--accent); }

  #results { display: grid; gap: 14px; margin-top: 20px;
             grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 18px; display: grid; gap: 10px; align-content: start; }
  .card-head { display: flex; justify-content: space-between; gap: 12px; }
  .card h2 { font-size: 1.1rem; margin: 0; }
  .artist { color: var(--muted); font-size: 0.9rem; }
  .dots { display: flex; gap: 3px; flex-shrink: 0; padding-top: 6px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.85rem; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 600; }
  .chords { display: flex; flex-wrap: wrap; gap: 6px; }
  .chords span { background: var(--chip); border-radius: 6px; padding: 3px 9px;
                 font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
  .pattern { font-family: ui-monospace, Consolas, monospace; background: var(--chip);
             border-radius: 6px; padding: 6px 10px; overflow-x: auto; white-space: nowrap; }
  .skill { font-size: 0.9rem; }
  .skill::before { content: "Trains: "; color: var(--muted); }
  .why { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .links { display: flex; gap: 14px; font-size: 0.85rem; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .links a:hover { text-decoration: underline; }
  .note { color: var(--muted); font-size: 0.8rem; margin-top: 24px; }
  details.sheet { border-top: 1px solid var(--line); padding-top: 8px; }
  details.sheet summary { cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--accent); }
  .sections { display: grid; gap: 8px; margin-top: 10px; }
  .section-name { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
                  color: var(--muted); margin-bottom: 3px; }
  .times { color: var(--muted); font-size: 0.8rem; align-self: center; }
</style>
</head>
<body>
<main>
  <h1>Practice Picks</h1>
  <p class="sub">Songs to practice on guitar, picked from artists who sound like the ones you love.</p>

  <form id="form">
    <label class="field">Artists you like (up to 5)
      <div class="artist-box" id="artist-box">
        <input id="artist-input" placeholder="Type an artist, press Enter">
      </div>
    </label>
    <div class="row">
      <label class="field">Level
        <select id="level">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="include-own"> Include these artists' own songs</label>
      <button class="go" id="go" type="submit">Find songs</button>
    </div>
  </form>

  <p id="status" hidden></p>
  <div id="results"></div>
  <p class="note" id="note" hidden></p>
</main>

<script>
  const artists = ["Bruno Mars", "Malcolm Todd", "Grent Perez"];
  const box = document.getElementById("artist-box");
  const input = document.getElementById("artist-input");
  const statusEl = document.getElementById("status");
  const results = document.getElementById("results");
  const goBtn = document.getElementById("go");

  function renderTags() {
    box.querySelectorAll(".tag").forEach(t => t.remove());
    artists.forEach((name, i) => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = name;
      const x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.title = "Remove";
      x.onclick = () => { artists.splice(i, 1); renderTags(); };
      tag.append(x);
      box.insertBefore(tag, input);
    });
    input.disabled = artists.length >= 5;
  }

  function addArtist() {
    const name = input.value.trim();
    if (name && artists.length < 5 &&
        !artists.some(a => a.toLowerCase() === name.toLowerCase())) {
      artists.push(name);
      renderTags();
    }
    input.value = "";
  }

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addArtist(); }
    if (e.key === "Backspace" && !input.value && artists.length) { artists.pop(); renderTags(); }
  });
  box.addEventListener("click", () => input.focus());

  function setStatus(text, isError) {
    statusEl.hidden = !text;
    statusEl.textContent = text || "";
    statusEl.className = isError ? "error" : "";
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function links(song) {
    const q = encodeURIComponent(`${song.artist} ${song.title}`);
    const row = el("div", "links");
    const found = [];
    if (song.tab) {
      const tab = el("a", null, "Songsterr tab ↗");
      tab.href = song.tab.url;
      found.push(tab);
    }
    const sheet = el("a", null, "Chord sheet ↗");
    sheet.href = `https://www.ultimate-guitar.com/search.php?search_type=title&value=${q}`;
    const lesson = el("a", null, "Video lesson ↗");
    lesson.href = `https://www.youtube.com/results?search_query=${q}+guitar+lesson`;
    [...found, sheet, lesson].forEach(a => { a.target = "_blank"; a.rel = "noopener"; row.append(a); });
    return row;
  }

  // "Tab difficulty 3 · Tuning Drop D · Acoustic Guitar" from Songsterr.
  function tabMeta(tab, withDifficulty) {
    const meta = el("div", "meta");
    const item = (label, value) => {
      const span = el("span", null, label ? `${label} ` : "");
      span.append(el("b", null, value));
      meta.append(span);
    };
    if (withDifficulty && tab.difficulty != null) item("Tab difficulty", tab.difficulty);
    if (tab.tuning) item("Tuning", tab.tuning);
    item("", tab.instrument.replace(/\s*\(.*\)/, ""));
    return meta;
  }

  function chordChips(names) {
    const row = el("div", "chords");
    names.forEach(ch => row.append(el("span", null, ch)));
    return row;
  }

  // Expandable section-by-section chords worked out from the Songsterr tab.
  function sheetDetails(sheet) {
    const details = el("details", "sheet");
    details.append(el("summary", null, sheet.capo ? `Chord sheet · capo ${sheet.capo}` : "Chord sheet"));
    const list = el("div", "sections");
    sheet.sections.forEach(section => {
      const block = el("div");
      const row = chordChips(section.chords);
      if (section.times > 1) row.append(el("span", "times", `×${section.times}`));
      block.append(el("div", "section-name", section.name), row);
      list.append(block);
    });
    details.append(list);
    return details;
  }

  // Free mode (no Claude): chords from the Songsterr tab, tab info, and links.
  function basicCard(song) {
    const c = el("article", "card");
    const titles = el("div");
    titles.append(el("h2", null, song.title), el("div", "artist", song.artist));
    c.append(titles);
    if (song.tab) c.append(tabMeta(song.tab, true));
    if (song.sheet) {
      const capo = el("div", "meta");
      const sheet = song.sheet;
      capo.append(el("span", null, !sheet.capo ? "Chords, no capo:"
        : sheet.capo_suggested ? `Capo fret ${sheet.capo} (makes easier shapes) · play:`
        : `Capo fret ${sheet.capo} · play:`));
      c.append(capo, chordChips(song.sheet.chords), sheetDetails(song.sheet));
    }
    c.append(el("p", "why", `Similar to ${song.similar_to.join(", ")}`), links(song));
    return c;
  }

  function card(song) {
    const c = el("article", "card");

    const head = el("div", "card-head");
    const titles = el("div");
    titles.append(el("h2", null, song.title), el("div", "artist", song.artist));
    const dots = el("div", "dots");
    dots.title = `Difficulty ${song.difficulty}/5`;
    for (let i = 1; i <= 5; i++) dots.append(el("i", i <= song.difficulty ? "on" : ""));
    head.append(titles, dots);

    const meta = el("div", "meta");
    meta.innerHTML = "<span>Key <b></b></span><span>Capo <b></b></span>";
    meta.querySelectorAll("b")[0].textContent = song.key;
    meta.querySelectorAll("b")[1].textContent = song.capo ? `fret ${song.capo}` : "none";

    const chords = el("div", "chords");
    song.chords.forEach(ch => chords.append(el("span", null, ch)));

    c.append(head, meta, chords, el("div", "pattern", song.pattern),
             el("div", "skill", song.skill), el("p", "why", song.why));
    if (song.tab) c.append(tabMeta(song.tab, false));
    if (song.sheet) c.append(sheetDetails(song.sheet));
    c.append(links(song));
    return c;
  }

  document.getElementById("form").addEventListener("submit", async e => {
    e.preventDefault();
    addArtist();
    if (!artists.length) return setStatus("Add at least one artist.", true);

    goBtn.disabled = true;
    results.replaceChildren();
    document.getElementById("note").hidden = true;
    setStatus("Finding similar artists and picking songs…");

    try {
      const resp = await fetch("/api/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          artists,
          level: document.getElementById("level").value,
          include_own: document.getElementById("include-own").checked,
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || "Something went wrong.");

      data.songs.forEach(s => results.append(data.detailed ? card(s) : basicCard(s)));
      const note = document.getElementById("note");
      note.textContent = data.detailed
        ? "Chords and patterns come from Claude and are usually right, but check the tab before learning a whole song."
        : "Popular songs from similar artists that have a Songsterr tab at your level, easiest first. Chords come from the tab: the tab author's chord names where they wrote them, otherwise worked out from the notes, which is right about 9 times in 10. Difficulty is Songsterr's rating of the most-played guitar part (about 1 = easy strumming, 8 = shred).";
      note.hidden = !data.songs.length;
      const missing = data.not_found.length ? ` Couldn't find: ${data.not_found.join(", ")}.` : "";
      setStatus(data.songs.length ? missing : "No good matches for that level. Try another level." + missing,
                !!missing);
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      goBtn.disabled = false;
    }
  });

  renderTags();
</script>
</body>
</html>
